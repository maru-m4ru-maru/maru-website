<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    id="metaDescription"
    name="description"
    content=""
  >

  <meta
    name="theme-color"
    content="#f5f7fa"
  >

  <title>maru_m4ru_maru</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- =========================================================
       HEADER
  ========================================================== -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="#top"
        class="brand"
      >

        <span class="brand-avatar-wrap">

          <img
            id="siteAvatar"
            class="brand-avatar"
            src=""
            alt=""
          >

        </span>

        <span class="brand-copy">

          <strong
            id="siteName"
            class="brand-name"
          >
            maru_m4ru_maru
          </strong>

          <span class="brand-subtitle">
            OFFICIAL WEBSITE
          </span>

        </span>

      </a>


      <nav
        id="siteNavigation"
        class="nav"
        aria-label="メインナビゲーション"
      ></nav>

    </div>

  </header>


  <!-- =========================================================
       MAIN
  ========================================================== -->

  <main id="top">

    <div id="siteSections"></div>

  </main>


  <!-- =========================================================
       FOOTER
  ========================================================== -->

  <footer
    id="siteFooter"
    class="site-footer"
  >

    <div class="container footer-inner">

      <div class="footer-left">

        <strong id="footerSiteName">
          maru_m4ru_maru
        </strong>

        <span
          id="footerText"
          class="footer-text"
        >
          Built by maru_m4ru_maru
        </span>

      </div>


      <div class="footer-right">

        <span>
          © <span id="currentYear"></span>
        </span>

      </div>

    </div>

  </footer>


  <script src="./main.js"></script>

</body>
</html>
