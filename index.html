<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    id="metaDescription"
    content="maru_m4ru_maru が制作しているツール・サービス・プロジェクトを紹介しています。"
  >

  <title>
    maru_m4ru_maru - Official Website
  </title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="#top"
        class="brand"
      >

        <img
          class="brand-avatar"
          data-site-avatar
          src="https://uploads.scratch.mit.edu/get_image/user/175225580_60x60.png"
          alt="maru_m4ru_maru"
        >

        <span
          class="brand-name"
          data-site-name
        >
          maru_m4ru_maru
        </span>

      </a>


      <nav
        class="nav"
        id="siteNavigation"
      ></nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main id="top">

    <!-- CMS sections are rendered here -->

    <div
      id="siteSections"
    ></div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer
    class="site-footer"
    id="siteFooter"
  >

    <div class="container footer-inner">

      <div>

        <strong
          data-site-name
        >
          maru_m4ru_maru
        </strong>

        <span>
          ©
          <span
            data-current-year
          ></span>
        </span>

      </div>


      <div
        class="footer-links"
        id="footerLinks"
      ></div>

    </div>

  </footer>


  <script src="./main.js"></script>

</body>

</html>
