<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まる - 管理画面</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f7fb;
      color: #111923;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
    }

    .login-box {
      width: min(92vw, 420px);

      padding: 32px;

      border: 1px solid #dfe5ec;
      border-radius: 18px;

      background: #ffffff;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      margin-bottom: 18px;

      border-radius: 13px;

      background: #5bbcff;
      color: #061019;

      font-size: 24px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .description {
      margin: 0 0 26px;
      color: #6f7a89;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #d8e0e9;
      border-radius: 10px;

      background: #f9fbfd;
      color: #111923;

      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #5bbcff;

      box-shadow:
        0 0 0 3px rgba(91, 188, 255, 0.14);
    }

    button {
      width: 100%;
      height: 46px;

      margin-top: 8px;

      border: 0;
      border-radius: 10px;

      background: #1689d8;
      color: white;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;
    }

    button:hover {
      background: #0f79c2;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 22px;

      margin-top: 14px;

      color: #d33;
      font-size: 13px;
      font-weight: 600;

      text-align: center;
    }

    .back {
      display: block;

      margin-top: 20px;

      color: #6f7a89;

      font-size: 12px;
      text-align: center;
      text-decoration: none;
    }

    .back:hover {
      color: #1689d8;
    }
  </style>
</head>

<body>

  <main class="login-box">

    <div class="logo">ま</div>

    <h1>管理画面</h1>

    <p class="description">
      まる公式サイトの管理者ログイン
    </p>

    <form id="login-form">

      <div class="field">
        <label for="password1">
          パスワード1
        </label>

        <input
          id="password1"
          type="password"
          autocomplete="off"
          required
        >
      </div>

      <div class="field">
        <label for="password2">
          パスワード2
        </label>

        <input
          id="password2"
          type="password"
          autocomplete="off"
          required
        >
      </div>

      <button
        id="login-button"
        type="submit"
      >
        ログイン
      </button>

      <div id="message"></div>

    </form>

    <a
      class="back"
      href="../"
    >
      ← ホームページへ戻る
    </a>

  </main>

  <script src="admin.js"></script>

</body>
</html>
