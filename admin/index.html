<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理画面ログイン - maru_website</title>

  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #15171b;
      --text-soft: #6b727c;
      --text-muted: #949aa3;
      --border: #e1e4e8;
      --border-dark: #d2d6dc;
      --accent: #111318;
      --danger: #c84f4f;
      --success: #168352;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        Meiryo,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(255, 255, 255, 0.95),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .login-shell {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-bottom: 18px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--accent);
      color: white;

      font-size: 14px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-card {
      padding: 26px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.96);

      box-shadow:
        0 20px 60px rgba(15, 20, 30, 0.08);
    }

    .kicker {
      margin-bottom: 7px;

      color: var(--text-muted);

      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;

      font-size: 27px;
      line-height: 1.15;

      letter-spacing: -0.045em;
    }

    .description {
      margin: 9px 0 22px;

      color: var(--text-soft);

      font-size: 11px;
      line-height: 1.75;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;

      margin-bottom: 6px;

      color: var(--text-soft);

      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .field input {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid var(--border-dark);
      border-radius: 9px;

      outline: none;

      background: white;
      color: var(--text);

      font-size: 12px;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .field input:focus {
      border-color: #969da7;

      box-shadow:
        0 0 0 3px rgba(17, 19, 24, 0.05);
    }

    .login-button {
      width: 100%;

      min-height: 42px;

      margin-top: 5px;

      border: 0;
      border-radius: 9px;

      background: var(--accent);
      color: white;

      font-size: 12px;
      font-weight: 800;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        opacity 0.18s ease;
    }

    .login-button:hover {
      background: #25282e;
      transform: translateY(-1px);
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .message {
      min-height: 18px;

      margin-top: 12px;

      font-size: 10px;
      line-height: 1.5;
      text-align: center;
    }

    .message.error {
      color: var(--danger);
    }

    .message.success {
      color: var(--success);
    }

    .login-footer {
      margin-top: 15px;

      color: var(--text-muted);

      font-size: 9px;
      line-height: 1.6;

      text-align: center;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      margin-top: 15px;

      color: var(--text-muted);

      font-size: 9px;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 0 4px rgba(22, 131, 82, 0.09);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 21px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="login-shell">

    <div class="brand">
      <div class="brand-mark">M</div>

      <div class="brand-name">
        maru_website
      </div>
    </div>


    <section class="login-card">

      <div class="kicker">
        ADMIN PANEL
      </div>

      <h1>
        管理画面にログイン
      </h1>

      <p class="description">
        サイトの内容を編集するには、
        2つのパスワードを入力してください。
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="password1">
            パスワード 1
          </label>

          <input
            id="password1"
            name="password1"
            type="password"
            autocomplete="current-password"
            placeholder="パスワードを入力"
            required
          >

        </div>


        <div class="field">

          <label for="password2">
            パスワード 2
          </label>

          <input
            id="password2"
            name="password2"
            type="password"
            autocomplete="current-password"
            placeholder="パスワードを入力"
            required
          >

        </div>


        <button
          id="loginButton"
          type="submit"
          class="login-button"
        >
          ログイン
        </button>

      </form>


      <div
        id="loginMessage"
        class="message"
        aria-live="polite"
      ></div>


      <div class="status-line">
        <span class="status-dot"></span>
        管理システム ONLINE
      </div>

    </section>


    <div class="login-footer">
      管理権限がない場合はログインできません。
    </div>

  </main>


  <script src="./login.js"></script>

</body>
</html>
