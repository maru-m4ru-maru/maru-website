<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理者ログイン - maru_m4ru_maru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      background: #f4f7fb;
      color: #111827;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        Meiryo,
        sans-serif;
    }

    .box {
      width: min(
        calc(100% - 28px),
        420px
      );

      padding: 30px;

      border:
        1px solid
        #e0e6ee;

      border-radius: 16px;

      background: white;

      box-shadow:
        0 14px 40px
        rgba(20, 35, 55, .08);
    }

    h1 {
      margin: 0 0 7px;

      font-size: 26px;
    }

    .description {
      margin: 0 0 24px;

      color: #6f7a89;

      font-size: 13px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 44px;

      padding:
        0
        12px;

      border:
        1px solid
        #d8e0e9;

      border-radius: 9px;

      outline: none;

      background: #fbfcfe;

      font: inherit;
    }

    input:focus {
      border-color: #1689d8;

      box-shadow:
        0 0 0 3px
        rgba(22, 137, 216, .1);
    }

    button {
      width: 100%;
      height: 44px;

      margin-top: 5px;

      border: 0;
      border-radius: 9px;

      background: #1689d8;
      color: white;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      min-height: 20px;

      margin-top: 12px;

      color: #d33;

      font-size: 12px;
      font-weight: 700;

      text-align: center;
    }

    .back {
      display: block;

      margin-top: 18px;

      color: #7a8594;

      font-size: 11px;

      text-align: center;
    }
  </style>
</head>

<body>

  <main class="box">

    <h1>管理者ログイン</h1>

    <p class="description">
      maru_m4ru_maru 公式サイト
    </p>

    <form id="login-form">

      <div class="field">
        <label for="password1">
          パスワード1
        </label>

        <input
          id="password1"
          type="password"
          autocomplete="off"
          required
        >
      </div>

      <div class="field">
        <label for="password2">
          パスワード2
        </label>

        <input
          id="password2"
          type="password"
          autocomplete="off"
          required
        >
      </div>

      <button
        id="login-button"
        type="submit"
      >
        ログイン
      </button>

      <div id="message"></div>

    </form>

    <a
      class="back"
      href="../"
    >
      ← ホームページへ戻る
    </a>

  </main>

  <script src="admin.js"></script>

</body>
</html>
