<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>サイト管理 - maru_m4ru_maru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #111827;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        Meiryo,
        sans-serif;
    }

    .header {
      height: 62px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #ffffff;

      border-bottom: 1px solid #e1e7ee;
    }

    .header strong {
      font-size: 14px;
    }

    .logout {
      border: 0;
      background: transparent;

      color: #687486;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .wrapper {
      width: min(
        calc(100% - 28px),
        900px
      );

      margin: 30px auto 70px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .sub {
      margin: 4px 0 24px;

      color: #6f7a89;

      font-size: 13px;
    }

    .card {
      margin-bottom: 14px;
      padding: 22px;

      background: #ffffff;

      border: 1px solid #e1e7ee;
      border-radius: 14px;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 16px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #d9e1e9;
      border-radius: 9px;

      background: #fbfcfe;
      color: #111827;

      font: inherit;
      outline: none;
    }

    input {
      height: 43px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #1689d8;

      box-shadow:
        0 0 0 3px
        rgba(22, 137, 216, .1);
    }

    .save {
      min-height: 43px;

      padding: 0 20px;

      border: 0;
      border-radius: 9px;

      background: #1689d8;
      color: #ffffff;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
    }

    .save:hover {
      background: #117bbf;
    }

    .save:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;

      font-size: 12px;
      font-weight: 700;
    }

    .status.success {
      color: #17834b;
    }

    .status.error {
      color: #d13b3b;
    }

    .note {
      margin-top: 8px;

      color: #7b8796;

      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <script>
    const token =
      sessionStorage.getItem(
        "maru_admin_token"
      );

    const expires =
      Number(
        sessionStorage.getItem(
          "maru_admin_expires"
        )
      );

    if (
      !token ||
      !expires ||
      Date.now() >= expires
    ) {
      sessionStorage.removeItem(
        "maru_admin_token"
      );

      sessionStorage.removeItem(
        "maru_admin_expires"
      );

      window.location.replace("./");
    }
  </script>


  <header class="header">

    <strong>
      maru_m4ru_maru / 管理画面
    </strong>

    <button
      class="logout"
      id="logout"
      type="button"
    >
      ログアウト
    </button>

  </header>


  <main class="wrapper">

    <h1>
      サイト管理
    </h1>

    <p class="sub">
      ここを書き換えて「保存する」を押すだけ。
    </p>


    <section class="card">

      <h2>
        基本情報
      </h2>

      <div class="field">

        <label for="site-name">
          表示名
        </label>

        <input
          id="site-name"
          type="text"
        >

      </div>


      <div class="field">

        <label for="tagline">
          キャッチコピー
        </label>

        <input
          id="tagline"
          type="text"
        >

      </div>


      <div class="field">

        <label for="description">
          説明
        </label>

        <textarea
          id="description"
        ></textarea>

      </div>

    </section>


    <section class="card">

      <h2>
        まる Addons
      </h2>

      <div class="field">

        <label for="addons-version">
          最新バージョン
        </label>

        <input
          id="addons-version"
          type="text"
        >

      </div>


      <div class="field">

        <label for="addons-update">
          最新アップデート
        </label>

        <textarea
          id="addons-update"
        ></textarea>

      </div>


      <div class="field">

        <label for="update-date">
          更新日
        </label>

        <input
          id="update-date"
          type="text"
          placeholder="2026.09.02"
        >

      </div>

    </section>


    <section class="card">

      <button
        class="save"
        id="save"
        type="button"
      >
        保存する
      </button>

      <div
        class="status"
        id="status"
      ></div>

      <p class="note">
        保存するとGitHubのsite-data.jsonが更新されます。
        GitHub Pagesへの反映には少し時間がかかる場合があります。
      </p>

    </section>

  </main>


  <script>
    "use strict";

    const WORKER_URL =
      "https://maru-website-admin.maru-0727.workers.dev";

    const DATA_URL =
      "../site-data.json";


    const siteName =
      document.getElementById(
        "site-name"
      );

    const tagline =
      document.getElementById(
        "tagline"
      );

    const description =
      document.getElementById(
        "description"
      );

    const addonsVersion =
      document.getElementById(
        "addons-version"
      );

    const addonsUpdate =
      document.getElementById(
        "addons-update"
      );

    const updateDate =
      document.getElementById(
        "update-date"
      );

    const saveButton =
      document.getElementById(
        "save"
      );

    const status =
      document.getElementById(
        "status"
      );

    const logout =
      document.getElementById(
        "logout"
      );


    function showStatus(
      text,
      type = ""
    ) {
      status.textContent = text;

      status.className =
        `status ${type}`;
    }


    async function loadSiteData() {
      try {

        showStatus(
          "現在の内容を読み込み中..."
        );

        const response =
          await fetch(
            `${DATA_URL}?cb=${Date.now()}`,
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `読み込み失敗: HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        siteName.value =
          data.siteName || "";

        tagline.value =
          data.tagline || "";

        description.value =
          data.description || "";

        addonsVersion.value =
          data.addonsVersion || "";

        addonsUpdate.value =
          data.addonsUpdate || "";

        updateDate.value =
          data.updateDate || "";

        showStatus("");

      } catch (error) {

        console.error(
          "[Maru Admin]",
          error
        );

        showStatus(
          error.message ||
          "サイト情報の読み込みに失敗しました",
          "error"
        );
      }
    }


    saveButton.addEventListener(
      "click",
      async () => {

        const currentToken =
          sessionStorage.getItem(
            "maru_admin_token"
          );

        if (!currentToken) {
          window.location.replace(
            "./"
          );

          return;
        }


        const siteData = {
          siteName:
            siteName.value.trim(),

          tagline:
            tagline.value.trim(),

          description:
            description.value.trim(),

          addonsVersion:
            addonsVersion.value.trim(),

          addonsUpdate:
            addonsUpdate.value.trim(),

          updateDate:
            updateDate.value.trim()
        };


        saveButton.disabled =
          true;

        saveButton.textContent =
          "保存中...";

        showStatus("");


        try {

          const response =
            await fetch(
              `${WORKER_URL}/admin/save`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Authorization":
                    `Bearer ${currentToken}`
                },

                body:
                  JSON.stringify({
                    siteData
                  })
              }
            );


          let data = null;

          try {
            data =
              await response.json();
          } catch {
            data = null;
          }


          if (
            response.status === 401
          ) {
            sessionStorage.removeItem(
              "maru_admin_token"
            );

            sessionStorage.removeItem(
              "maru_admin_expires"
            );

            alert(
              "ログインの有効期限が切れました。"
            );

            window.location.replace(
              "./"
            );

            return;
          }


          if (
            !response.ok ||
            !data?.success
          ) {
            throw new Error(
              data?.message ||
              `保存に失敗しました (HTTP ${response.status})`
            );
          }


          showStatus(
            "保存しました！",
            "success"
          );


        } catch (error) {

          console.error(
            "[Maru Admin Save]",
            error
          );

          showStatus(
            error.message ||
            "保存に失敗しました",
            "error"
          );

        } finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "保存する";
        }
      }
    );


    logout.addEventListener(
      "click",
      () => {

        sessionStorage.removeItem(
          "maru_admin_token"
        );

        sessionStorage.removeItem(
          "maru_admin_expires"
        );

        window.location.replace(
          "./"
        );
      }
    );


    loadSiteData();

  </script>

</body>

</html>
