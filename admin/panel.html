<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理パネル - maru_website</title>
<link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="./pro-cms.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="sidebar-brand"><div class="brand-mark">M</div><div class="brand-text"><strong>maru_website</strong><span>ADMIN PANEL</span></div></div>
<nav class="sidebar-nav">
<button class="nav-item active" data-page="overview"><span>⌂</span><b>概要</b><small>OVERVIEW</small></button>
<button class="nav-item" data-page="site"><span>◉</span><b>サイト</b><small>SITE</small></button>
<button class="nav-item" data-page="pages"><span>▣</span><b>ページ</b><small>PAGES</small></button>
<button class="nav-item" data-page="sections"><span>☷</span><b>セクション</b><small>SECTIONS</small></button>
<button class="nav-item" data-page="projects"><span>◆</span><b>プロジェクト</b><small>PROJECTS</small></button>
<button class="nav-item" data-page="updates"><span>↗</span><b>更新情報</b><small>UPDATES</small></button>
<button class="nav-item" data-page="links"><span>↗</span><b>リンク</b><small>LINKS</small></button>
<button class="nav-item" data-page="embeds"><span>▤</span><b>埋め込み</b><small>EMBEDS</small></button>
<button class="nav-item" data-page="navigation"><span>≡</span><b>ナビゲーション</b><small>NAVIGATION</small></button>
<button class="nav-item" data-page="settings"><span>⚙</span><b>サイト設定</b><small>SETTINGS</small></button>
</nav>
<div class="sidebar-bottom">
<button id="openEditorButton" class="sidebar-small-button" type="button">✎ ホームを編集</button>
<button id="helpButton" class="sidebar-small-button" type="button">? はじめてガイド</button>
<button id="logoutButton" class="sidebar-small-button danger" type="button">ログアウト</button>
</div>
</aside>
<main class="main">
<header class="topbar"><div><div id="pageKicker" class="topbar-kicker">ADMIN</div><h1 id="pageTitle">概要</h1></div><div class="topbar-actions"><div id="saveState" class="save-state saved">保存済み</div><button id="saveButton" class="button primary" type="button">保存する</button></div></header>
<section id="pageContent" class="page-content"></section>
</main>
<aside class="preview"><div class="preview-header"><div><strong>ライブプレビュー</strong><span>LIVE</span></div><button id="refreshPreviewButton" class="icon-button" type="button" title="プレビューを更新">↻</button></div><div class="preview-window"><div class="preview-browser"><span></span><span></span><span></span><div class="preview-url">maru-m4ru-maru.github.io/maru-website</div></div><div id="previewContent" class="preview-content"></div></div></aside>
</div>
<div id="helpModal" class="modal hidden"><div class="modal-backdrop"></div><div class="modal-card"><div class="modal-header"><div><span class="modal-kicker">ADMIN GUIDE</span><h2>操作説明</h2></div><button id="closeHelpButton" class="icon-button" type="button" aria-label="閉じる">×</button></div></div></div>
<script src="./admin.js"></script>
<script src="./pages.js"></script>
<script src="./pro-cms.js"></script>
<script src="./revision-hook.js"></script>
<script src="./guide.js"></script>
</body>
</html>
